services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: dchub
      POSTGRES_USER: dchub
      POSTGRES_PASSWORD: dchub
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dchub"]
      interval: 5s
      timeout: 3s
      retries: 10

  hub:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/dchub
      DB_USERNAME: dchub
      DB_PASSWORD: dchub
    ports:
      - "8080:8080"
